# ── macOS Liquid Glass Terminal Configuration ──

# Font
font_family               monospace
font_size                 12.5
bold_font                 auto
italic_font               auto
bold_italic_font          auto

# Liquid Glass Transparency & Blur
background_opacity         0.78
background_blur            1
dynamic_background_opacity yes

# macOS Window Appearance
window_padding_width       16
hide_window_decorations    yes
confirm_os_window_close    0
remember_window_size       yes

# Cursor
cursor                     #33ccff
cursor_text_color          #141419
cursor_shape               beam
cursor_blink_interval      0.5

# Liquid Glass Color Palette (Apple Space Gray & Frosted Acrylic)
background                 #141419
foreground                 #f5f5f7
selection_background       #0a6cff
selection_foreground       #ffffff

