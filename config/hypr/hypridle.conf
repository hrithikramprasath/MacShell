general {
    lock_cmd = sh /home/hrithikramprasath/.config/quickshell/MacLock/lock-via-ipc.sh
    before_sleep_cmd = sh /home/hrithikramprasath/.config/quickshell/MacLock/lock-via-ipc.sh
}

# Auto-lock after 5 minutes of inactivity (300 seconds)
listener {
    timeout = 300
    on-timeout = sh /home/hrithikramprasath/.config/quickshell/MacLock/lock-via-ipc.sh
}

# Turn off displays after 10 minutes of inactivity (600 seconds)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
